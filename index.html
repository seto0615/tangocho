<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tangocho — 自分でつくる英単語帳</title>
  <meta name="description" content="スクリーンショットやテキストからAIで英単語と日本語訳を読み取り、自分だけの単語帳をつくってテストできるWebアプリ。">
  <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1524" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tangocho">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // テーマのちらつき防止（描画前に適用）
    try {
      var t = JSON.parse(localStorage.getItem('tangocho:v1') || '{}');
      var theme = t.settings && t.settings.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <nav id="tabbar" class="tabbar" aria-label="メインナビゲーション"></nav>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
